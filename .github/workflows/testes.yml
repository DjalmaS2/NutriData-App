# Roda os testes automáticos no GitHub a cada push e pull request.
# O resultado aparece como ✅ ou ❌ ao lado de cada commit no repositório.
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Biblioteca do sistema usada pelo pyzbar (leitura de código de barras), igual ao packages.txt
      - name: Instalar libzbar0
        run: sudo apt-get update && sudo apt-get install -y libzbar0

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar os testes
        run: python -m pytest -q
